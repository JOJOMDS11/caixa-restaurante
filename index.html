<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>South Of France · Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --pine:#1E2A20;
    --pine-deep:#152018;
    --paper:#FAF7F1;
    --ink:#24261F;
    --wine:#8C3B2E;
    --wine-dark:#732E23;
    --olive:#5E6B45;
    --gold:#C79A3B;
    --line:#E4DFD3;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',sans-serif;
    background:radial-gradient(circle at 20% 15%, #24331F 0%, var(--pine) 45%, var(--pine-deep) 100%);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--paper);
    border-radius:4px;
    padding:40px 32px 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.45);
  }
  .brand{
    text-align:center;
    margin-bottom:32px;
  }
  .brand .mark{
    width:36px;height:2px;background:var(--gold);margin:0 auto 18px;
  }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:2rem;
    margin:0;
    color:var(--pine-deep);
    letter-spacing:0.01em;
  }
  .brand p{
    margin:6px 0 0;
    font-size:0.85rem;
    color:var(--olive);
  }
  label{
    display:block;
    font-size:0.78rem;
    font-weight:500;
    color:var(--olive);
    margin:0 0 6px;
  }
  .field{margin-bottom:18px;}
  input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:3px;
    font-size:0.95rem;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  input:focus{
    outline:none;
    border-color:var(--wine);
  }
  button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:none;
    border-radius:3px;
    background:var(--wine);
    color:#fff;
    font-family:inherit;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  button:hover{background:var(--wine-dark);}
  button:disabled{opacity:0.6;cursor:default;}
  .error{
    margin-top:14px;
    font-size:0.85rem;
    color:var(--wine-dark);
    text-align:center;
    min-height:1.2em;
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="mark"></div>
    <h1>South Of France</h1>
    <p>Fechamento de caixa</p>
  </div>

  <form id="loginForm">
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" required autocomplete="current-password">
    </div>
    <button type="submit" id="btnEntrar">Entrar</button>
    <div class="error" id="errorMsg"></div>
  </form>
</div>

<script>
async function checkSession(){
  const { data } = await db.auth.getSession();
  if (data.session) window.location.href = 'dashboard.html';
}
checkSession();

const form = document.getElementById('loginForm');
const btn = document.getElementById('btnEntrar');
const errorMsg = document.getElementById('errorMsg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;

  const { error } = await db.auth.signInWithPassword({ email, password: senha });

  if (error) {
    errorMsg.textContent = 'E-mail ou senha incorretos.';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  } else {
    window.location.href = 'dashboard.html';
  }
});
</script>

</body>
</html>
